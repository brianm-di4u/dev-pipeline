# Keep this list in step with the allowlist in THIRD_PARTY.md.
[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unlicense", "CC0-1.0", "0BSD", "Zlib", "Unicode-3.0", "MPL-2.0"]

[bans]
