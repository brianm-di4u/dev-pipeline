# Keep this list in step with the allowlist in THIRD_PARTY.md. Tauri's dependency
# tree needs a few more permissive licenses than a small project usually would.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unlicense",
  "CC0-1.0", "0BSD", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
